name: NETO Daily Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p build-out
          cp android/app/build/outputs/apk/debug/app-debug.apk build-out/NETO-Daily-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NETO-Daily-debug-apk
          path: build-out/NETO-Daily-debug.apk
          if-no-files-found: error
